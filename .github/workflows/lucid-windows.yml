name: Lucid Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version for a manual build
        required: true
        default: '0.6.0'
  push:
    tags: ['lucid-v*']
permissions:
  contents: read
concurrency:
  group: lucid-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-state:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - name: Test release checks
        run: python3 .github/scripts/test-lucid-release-state.py
      - name: Check for an already published version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('lucid-v{0}', inputs.version) }}
        run: python3 .github/scripts/lucid-release-state.py
  windows:
    needs: release-state
    if: needs.release-state.outputs.published != 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check and build Lucid
        shell: pwsh
        run: ./contrib/lucid/build.ps1
      - name: Test native installer safety
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (!$iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & (Join-Path $vs 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          python contrib/lucid/test-installer.py $iscc
          if ($LASTEXITCODE -ne 0) { throw 'Installer safety checks failed.' }
      - name: Package installer and clean portable ZIP
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ github.event.inputs.version }}
        run: |
          $version = $env:PACKAGE_VERSION
          if (!$version) { $version = $env:GITHUB_REF_NAME -replace '^lucid-v','' }
          ./contrib/lucid/package.ps1 -Version $version -Iscc $env:ISCC_PATH
      - uses: actions/upload-artifact@v4
        with:
          name: Spotifast-Lucid-Windows-x64
          path: |
            dist/Installers/Spotifast-Lucid-Windows-x64.zip
            dist/Installers/*-Setup.exe
            dist/Installers/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish tagged preview
        if: startsWith(github.ref, 'refs/tags/lucid-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $published = python .github/scripts/lucid-release-state.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the existing release.' }
          if ($published -eq 'true') { exit 0 }
          $notes = "contrib/lucid/RELEASE-$env:GITHUB_REF_NAME.md"
          if (!(Test-Path -LiteralPath $notes)) { $notes = 'FORK.md' }
          $assets = Get-ChildItem -LiteralPath dist/Installers -File | Where-Object { $_.Name -match '\.zip$|-Setup\.exe$|^SHA256SUMS\.txt$' } | Select-Object -ExpandProperty FullName
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "Spotifast Lucid $env:GITHUB_REF_NAME" --notes-file $notes
          if ($LASTEXITCODE -ne 0) {
            # A manual publisher may have finished while this build ran.
            # Keep a complete published release; never overwrite its assets.
            $published = python .github/scripts/lucid-release-state.py
            if ($LASTEXITCODE -ne 0 -or $published -ne 'true') { throw 'Release publication failed.' }
          }
